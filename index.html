<div id="salesGate" style="position:fixed;inset:0;z-index:1000;background:#F7F7F8;display:flex;align-items:center;justify-content:center;font-family:'Pretendard Variable',Pretendard,sans-serif">
  <form id="sgForm" action="javascript:void(0)" style="background:#fff;border:1px solid #E1E2E4;border-radius:14px;padding:36px 40px;width:min(380px,90vw);display:flex;flex-direction:column;gap:13px;box-shadow:0 14px 44px rgba(0,0,0,.1)">
    <div style="font-size:22px;font-weight:800;color:#171719">아이땅 <small style="font-weight:400;color:#7a7d85;font-size:15px">· 통합 업무관리</small></div>
    <div style="display:inline-block;align-self:flex-start;background:#3366FF;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px">웹앱 v1.0 · 공용 로그인</div>
    <div id="sgDiag" style="font-size:11px;color:#989BA2">서버 연결 확인 중…</div>
    <label style="display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#5c5f66">이메일
      <input type="email" id="sgEmail" autocomplete="username" required placeholder="name@company.com" style="font:inherit;font-size:14.5px;border:1px solid #DBDCDF;border-radius:8px;padding:10px 12px"></label>
    <label style="display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#5c5f66">비밀번호
      <input type="password" id="sgPw" autocomplete="current-password" required placeholder="비밀번호" style="font:inherit;font-size:14.5px;border:1px solid #DBDCDF;border-radius:8px;padding:10px 12px"></label>
    <button type="submit" id="sgBtn" style="font:inherit;margin-top:4px;padding:11px;font-size:14px;font-weight:600;background:#3366FF;color:#fff;border:none;border-radius:8px;cursor:pointer">로그인</button>
    <div id="sgErr" style="font-size:12.5px;color:#E52222" hidden></div>
    <div style="font-size:11.5px;color:#989BA2;line-height:1.6">영업관리·디자인설계 공용 계정입니다. 계정은 관리자가 발급합니다.</div>
  </form>
</div>

<script>
(function(){
  var URL_ = window.__SB_URL, KEY_ = window.__SB_KEY;
  var gate = document.getElementById("salesGate"), diag = document.getElementById("sgDiag"), errEl = document.getElementById("sgErr");
  var runBundle = function(){
    var src = document.getElementById("ittangBundle").textContent;
    try { (new Function(src))(); } catch (e) { console.error(e); diag.textContent = "앱 실행 오류: " + e.message; diag.style.color = "#E52222"; gate.style.display = "flex"; }
  };
  var hideGate = function(){ gate.style.display = "none"; };
  var showErr = function(msg){ errEl.textContent = msg; errEl.hidden = false; };
  var rowToMember = function(r){ return { id: r.id, name: r.name, unit: r.unit, role: r.role, title: r.title, email: r.email, phone: r.phone,
    perms: r.perms || {}, active: r.active !== false, aliases: r.aliases || [], authUserId: r.auth_user_id || null, sortNo: r.sort_no || r.id }; };
  var serverById = {};
  var isPlaceholderEmail = function(e){ return !e || /^[^@\s]+@ittang\.co\.kr$/i.test(e); };
  var memberToRow = function(m){
    var sv = serverById[m.id] || {};
    /* 이메일은 임시값(이름@ittang.co.kr)이면 서버 값을 보존 — 로그인 연결이 끊기지 않도록 */
    var email = isPlaceholderEmail(m.email) ? (sv.email || null) : m.email;
    return { id: m.id, name: m.name, unit: m.unit, role: m.role || "팀원", title: m.title, email: email, phone: m.phone || sv.phone || null,
    perms: m.perms || {}, active: m.active !== false, aliases: m.aliases || [], auth_user_id: m.authUserId || sv.authUserId || null, sort_no: m.sortNo || m.id }; };
  var dateOrNull = function(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : null; };
  var rowToDeal = function(r){ return { id: r.id, div: r.div, owner: r.owner, salesOwner: r.owner, name: r.name, type: r.type, amount: r.amount == null ? null : Number(r.amount),
    statusRaw: r.status_raw, month: r.month, stage: r.stage, prob: r.prob, customer: r.customer, contact: r.contact, phone: r.phone, address: r.address,
    consultDate: r.consult_date, route: r.route || "quote", designOwner: r.design_owner, planOwner: r.plan_owner, siteOwner: r.site_owner,
    designDetail: r.design_detail || null, pmSynced: !!r.pm_id, pmId: r.pm_id || null, pmStatus: r.pm_status || null, quoteNo: r.quote_no || null }; };
  var dealToRow = function(d){ return { id: d.id, div: d.div, owner: d.owner || d.salesOwner || null, name: d.name, type: d.type, amount: d.amount == null ? null : Number(d.amount),
    status_raw: d.statusRaw || null, month: d.month || null, stage: d.stage || null, prob: d.prob == null ? null : Number(d.prob), customer: d.customer || null,
    contact: d.contact || null, phone: d.phone || null, address: d.address || null, consult_date: dateOrNull(d.consultDate), route: d.route || null,
    design_owner: d.designOwner || null, plan_owner: d.planOwner || null, site_owner: d.siteOwner || null, design_detail: d.designDetail || null,
    pm_id: d.pmId || null, pm_status: d.pmStatus || null, quote_no: d.quoteNo || null, updated_at: new Date().toISOString() }; };
  var localFallback = function(reason){
    diag.textContent = reason + " — 로컬 모드로 실행합니다"; diag.style.color = "#E52222";
    try { window.__ITTANG_LOGIN_ID = +new URLSearchParams(location.search).get("u") || +localStorage.getItem("ittang.session") || null; } catch(e){}
    if (window.__ITTANG_LOGIN_ID){ hideGate(); runBundle(); }
  };
  (async function boot(){
    var lib = window.supabase;
    if (!lib || !lib.createClient){ localFallback("서버 라이브러리를 불러오지 못했습니다(인터넷 연결 확인)"); return; }
    var sb = lib.createClient(URL_, KEY_);
    window.__sb = sb;
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes && sessionRes.data && sessionRes.data.session;
    if (!session){ diag.textContent = "서버 연결됨 · 로그인하세요"; return; }
    diag.textContent = "데이터 불러오는 중…";
    var m = await sb.from("members").select("*").order("sort_no");
    if (m.error){ showErr("조직도 로드 실패: " + m.error.message); diag.textContent = "로그인 후 다시 시도"; return; }
    var members = (m.data || []).map(rowToMember);
    members.forEach(function(x){ serverById[x.id] = x; });
    var email = (session.user && session.user.email || "").toLowerCase();
    var me = members.find(function(x){ return (x.email || "").toLowerCase() === email && x.active; });
    if (!me){ showErr("로그인은 되었지만 조직도에 이 이메일(" + email + ")의 구성원이 없습니다. 관리자에게 등록을 요청하세요."); await sb.auth.signOut(); diag.textContent = "서버 연결됨 · 로그인하세요"; return; }
    var d = await sb.from("sales_deals").select("*").order("id");
    var deals = d.error ? [] : (d.data || []).map(rowToDeal);
    window.__ITTANG_LOGIN_ID = me.id;
    window.__SERVER = { members: members, deals: deals };
    try { localStorage.setItem("ittang.session", String(me.id)); } catch(e){}
    var timer = null, lastM = JSON.stringify(members), lastD = JSON.stringify(deals);
    window.__syncServer = function(payload){
      clearTimeout(timer);
      timer = setTimeout(async function(){
        try {
          var mj = JSON.stringify(payload.members), dj = JSON.stringify(payload.deals);
          var sig = function(list){ return (list || []).map(function(x){ return x.id + ":" + x.name + ":" + x.title + ":" + x.unit; }).sort().join("|"); };
          var isEmbeddedDefault = window.__MEMBERS && sig(payload.members) === sig(window.__MEMBERS) && mj !== lastM;
          if (isEmbeddedDefault){ console.warn("조직도가 내장 기본값으로 초기화된 상태 — 서버 조직도를 덮어쓰지 않습니다"); }
          else if (mj !== lastM){ var r1 = await sb.from("members").upsert(payload.members.map(memberToRow)); if (!r1.error) lastM = mj; else console.error("members sync", r1.error); }
          if (dj !== lastD){ var r2 = await sb.from("sales_deals").upsert(payload.deals.map(dealToRow)); if (!r2.error) lastD = dj; else console.error("deals sync", r2.error); }
        } catch (e) { console.error("sync", e); }
      }, 900);
    };
    window.__ittangLogout = async function(){ try { await sb.auth.signOut(); } catch(e){} try { localStorage.removeItem("ittang.session"); localStorage.removeItem("ittang.design.session"); } catch(e){} location.reload(); };
    hideGate(); runBundle();
  })().catch(function(e){ console.error(e); localFallback("서버 연결 오류: " + (e && e.message || e)); });
  document.getElementById("sgForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var btn = document.getElementById("sgBtn"); errEl.hidden = true;
    var sb = window.__sb;
    if (!sb){ showErr("서버에 연결되지 않았습니다. 인터넷 연결을 확인하세요."); return; }
    btn.disabled = true; btn.textContent = "확인 중…";
    var r = await sb.auth.signInWithPassword({ email: document.getElementById("sgEmail").value.trim(), password: document.getElementById("sgPw").value });
    if (r.error){ showErr(r.error.message === "Invalid login credentials" ? "이메일 또는 비밀번호가 올바르지 않습니다" : r.error.message); btn.disabled = false; btn.textContent = "로그인"; return; }
    location.reload();
  });
})();
</script>
